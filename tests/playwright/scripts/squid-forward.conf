# Minimal permissive forwarding (CONNECT) proxy for Podman Desktop E2E tests.
#
# This container is ephemeral CI-only infrastructure: it is bound to the
# runner's loopback interface for the lifetime of a single job and is never
# reachable from outside the runner, so an open ACL is acceptable here -
# do not reuse this configuration for anything internet-facing.

http_port 3128

acl CONNECT method CONNECT
http_access allow CONNECT
http_access allow all

visible_hostname pd-test-proxy
cache deny all

# Performance tuning for CI (default single-worker Squid caps throughput at
# one CPU core regardless of how many cores the runner has, and quickly
# becomes the bottleneck once pnpm/flatpak/apt open many parallel
# downloads). @@WORKERS@@ is substituted by setup-proxy.sh with the
# runner's core count.
workers @@WORKERS@@

# Runners' sandboxed networks routinely advertise IPv6 that doesn't
# actually route, so a AAAA-first lookup burns a full DNS timeout on every
# new host before falling back to A - this skips straight to IPv4.
dns_v4_first on

# stdio: writes each transaction synchronously, which under high request
# volume can block Squid's I/O loop on the container's log driver. daemon:
# offloads writing to a helper process, and buffering avoids flushing on
# every line.
access_log daemon:/var/log/squid/access.log squid
buffered_logs on

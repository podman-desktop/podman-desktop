# Points at an unreachable-but-syntactically-valid host so that any attempt to
# contact the API server has to go through the configured proxy.

apiVersion: v1
kind: Config
clusters:
  - name: proxy-test-cluster
    cluster:
      server: https://fake-cluster.proxy-test.invalid:6443
      insecure-skip-tls-verify: true
users:
  - name: proxy-test-user
    user:
      token: sha256~abcdefg
contexts:
  - name: proxy-test-context
    context:
      cluster: proxy-test-cluster
      name: proxy-test-context
      user: proxy-test-user
preferences: {}
current-context: proxy-test-context

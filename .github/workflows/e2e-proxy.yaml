# Runs the same E2E suite as e2e-main.yaml, but with a forwarding proxy
# (Squid) already running on the runner before Podman Desktop is launched,
# and HTTP_PROXY/HTTPS_PROXY exported so the app picks it up via its
# "System" proxy mode. Verifies Podman Desktop behaves correctly when
# opened in an environment with a preconfigured proxy.
name: e2e-tests-proxy

run-name: >-
  ${{ inputs.release_tag
      && format('e2e-tests-proxy [{0}]', inputs.release_tag)
      || github.workflow }}

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      organization:
        default: 'podman-desktop'
        description: 'Organization of the Podman Desktop repository'
        type: string
        required: true
      repositoryName:
        default: 'podman-desktop'
        description: 'Podman Desktop repository name'
        type: string
        required: true
      branch:
        default: 'main'
        description: 'Podman Desktop repo branch'
        type: string
        required: true
      npm_target:
        default: 'test:e2e'
        description: 'The npm target to run tests. Use "test:e2e:all" to run all test suites, including Kubernetes tests.'
        type: string
        required: true
      kind_provider:
        description: 'Kind cluster provider type'
        type: choice
        options:
        - docker
        - podman
        required: false
      release_tag:
        description: 'Tag to identify this run for report-portal'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  e2e-tests-proxy:
    name: Run E2E tests behind a proxy - ${{ matrix.installation }}
    runs-on: ubuntu-24.04
    # disable on forks as secrets are not available
    # if: github.event.repository.fork == false
    strategy:
      fail-fast: false
      matrix:
        installation: [source-build, flatpak-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.inputs.organization }}/${{ github.event.inputs.repositoryName }}
          ref: ${{ github.event.inputs.branch }}
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'schedule'

      - name: Set the default env. variables
        env:
          DEFAULT_NPM_TARGET: 'test:e2e'
          DEFAULT_KIND_PROVIDER: 'docker'
        run: |
          echo "NPM_TARGET=${{ github.event.inputs.npm_target || env.DEFAULT_NPM_TARGET }}" >> $GITHUB_ENV
          echo "KIND_PROVIDER=${{ github.event.inputs.kind_provider || env.DEFAULT_KIND_PROVIDER }}" >> $GITHUB_ENV

      - name: Install Podman v5 using external action
        # Use the action from the other repository
        uses: redhat-actions/podman-install@aea6ff44f2a4a82da13d22061ce73443a125925d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup testenv using external action
        uses: podman-desktop/e2e/.github/actions/pde2e-testenv-prepare@13e2c57c759137bfc1f437f221967461e8a98e2a

      - name: Remove pre-installed Docker images
        run: |
          echo "Removing pre-installed Docker images to prevent E2E test flakiness"
          docker image ls
          docker image rm --force $(docker image ls -q) 2>/dev/null || true
          docker system prune --all --force 2>/dev/null || true
          echo "Docker images after cleanup:"
          docker image ls

      - name: Setup insecure test registry
        run: |
          chmod +x tests/playwright/scripts/setup-insecure-registry.sh
          tests/playwright/scripts/setup-insecure-registry.sh start
          echo "Insecure registry started on localhost:5443"
          # Install self-signed cert into Ubuntu system trust store
          sudo cp /tmp/pd-test-registry/registry.crt /usr/local/share/ca-certificates/pd-test-registry.crt
          sudo update-ca-certificates
          echo "Self-signed cert installed into system trust store"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Install flatpak build dependencies
        if: matrix.installation == 'flatpak-build'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists flathub --user https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Start forwarding proxy and export HTTP_PROXY/HTTPS_PROXY
        run: |
          chmod +x tests/playwright/scripts/setup-proxy.sh
          tests/playwright/scripts/setup-proxy.sh start
          # Exported for the remainder of the job: the compile step and the
          # Podman Desktop process launched by the E2E run below inherit
          # these and Podman Desktop picks them up via its "System" proxy
          # mode (see packages/main/src/plugin/proxy-system.ts).
          echo "HTTP_PROXY=http://localhost:3128" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://localhost:3128" >> $GITHUB_ENV
          echo "http_proxy=http://localhost:3128" >> $GITHUB_ENV
          echo "https_proxy=http://localhost:3128" >> $GITHUB_ENV
          # Local/loopback traffic (e.g. the insecure test registry above)
          # must bypass the proxy - it isn't reachable from inside the
          # proxy's own container network namespace.
          echo "NO_PROXY=localhost,127.0.0.1,::1" >> $GITHUB_ENV
          echo "no_proxy=localhost,127.0.0.1,::1" >> $GITHUB_ENV

      - name: Run E2E tests in Production Mode
        if: matrix.installation == 'source-build'
        env:
          PODMANDESKTOP_CI_BOT_TOKEN: ${{ secrets.PODMANDESKTOP_CI_BOT_TOKEN }}
          TEST_PODMAN_MACHINE: 'true'
          SKIP_KIND_INSTALL: 'true'
          KIND_PROVIDER_GHA: ${{ env.KIND_PROVIDER }}
          ELECTRON_ENABLE_INSPECT: true
          INSECURE_REGISTRY_URL: 'localhost:5443'
          INSECURE_REGISTRY_USERNAME: 'testuser'
          INSECURE_REGISTRY_PASSWORD: 'testpassword123'
        run: |
          echo "Compiling the Podman Desktop in production mode"
          pnpm compile:current --linux dir
          path=$(realpath ./dist/linux-unpacked/podman-desktop)
          echo "Podman Desktop built binary: $path"
          export PODMAN_DESKTOP_BINARY=$path
          pnpm ${{ env.NPM_TARGET }}

      - name: Run E2E tests on Flatpak bundle
        if: matrix.installation == 'flatpak-build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PODMANDESKTOP_CI_BOT_TOKEN: ${{ secrets.PODMANDESKTOP_CI_BOT_TOKEN }}
          TEST_PODMAN_MACHINE: 'true'
          SKIP_KIND_INSTALL: 'true'
          KIND_PROVIDER_GHA: ${{ env.KIND_PROVIDER }}
          ELECTRON_ENABLE_INSPECT: true
          INSECURE_REGISTRY_URL: 'localhost:5443'
          INSECURE_REGISTRY_USERNAME: 'testuser'
          INSECURE_REGISTRY_PASSWORD: 'testpassword123'
        run: |
          echo "Building Podman Desktop flatpak bundle"
          pnpm compile:current --linux flatpak
          echo "Installing built flatpak bundle"
          flatpak install --bundle --user -y dist/*.flatpak
          path=$(realpath $(flatpak info --show-location io.podman_desktop.PodmanDesktop)/files/lib/io.podman_desktop.PodmanDesktop/podman-desktop)
          echo "Podman Desktop flatpak binary: $path"
          export PODMAN_DESKTOP_BINARY=$path
          pnpm ${{ env.NPM_TARGET }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always() # always run even if the previous step fails
        with:
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          annotate_only: true
          require_tests:  true
          report_paths: '**/*results.xml'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-tests-proxy-${{ matrix.installation }}
          path: |
            ./tests/**/output/
            !./tests/**/traces/raw

      - name: Dump proxy container logs on failure
        if: failure()
        run: podman logs pd-test-proxy || true

      - name: Cleanup forwarding proxy
        if: always()
        run: tests/playwright/scripts/setup-proxy.sh cleanup || true

      - name: Cleanup insecure test registry
        if: always()
        run: |
          tests/playwright/scripts/setup-insecure-registry.sh cleanup || true
          sudo rm -f /usr/local/share/ca-certificates/pd-test-registry.crt
          sudo update-ca-certificates || true
